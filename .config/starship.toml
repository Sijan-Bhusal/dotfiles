"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
scan_timeout = 500
command_timeout = 1000

# ── AMOLED theme ──────────────────────────────────────────
# bg=black   fg=#cdd6f4   blue=#89b4fa   mauve=#cba6f7
# green=#a6e3a1   red=#f38ba8   dim=#6c7086   mute=#585b70

format = """
[](#6c7086)\
$os\
$username\
[](#6c7086)\
$directory \
$git_branch\
$git_status\
$git_metrics\
[](#6c7086)\
$python\
$nodejs\
$rust\
$golang\
$bun\
$deno\
$java\
$ruby\
$php\
$lua\
$haskell\
$scala\
$elixir\
$julia\
$kotlin\
$swift\
$zig\
$nim\
$c\
$cpp\
$nix_shell\
$conda\
$docker_context\
$time\
$line_break\
$character"""

[character]
success_symbol = "[>](bold #89b4fa)"
error_symbol = "[✗](bold #f38ba8)"
vicmd_symbol = "[<](bold #a6e3a1)"

[directory]
style = "bold #cdd6f4"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only_style = "#f38ba8"
read_only = " 󰌾"

[git_branch]
format = "[$symbol$branch]($style)"
style = "#a6e3a1"
symbol = " "

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "#cba6f7"
conflicted = "🏳"
up_to_date = ""
untracked = " "
ahead = " ${count}"
behind = " ${count}"
staged = " "
modified = " "
renamed = " "
deleted = " "
stashed = " "

[git_metrics]
format = '([+$added]($added_style))([-$deleted]($deleted_style))'
added_style = "#a6e3a1"
deleted_style = "#f38ba8"
only_nonzero_diffs = true

[fill]
style = "#585b70"

[time]
format = "[$time]($style)"
time_format = "%H:%M"
style = "#6c7086"

[status]
format = "[$symbol$status]($style)"
style = "bg:#f38ba8"
disabled = false

[os]
disabled = false
style = "#6c7086"
format = "[$symbol]($style)"

[username]
show_always = false
style_user = "#cba6f7"
style_root = "#f38ba8"
format = "[$user]($style)"

