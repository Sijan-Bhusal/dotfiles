include ~/.config/kitty/dank-theme.conf

# 1. Change to a whole number to prevent sub-pixel blurring
font_size 10.8

# 2. Improve text sharpness on low-DPI screens
# This makes the font strokes slightly thicker and higher contrast
text_composition_strategy 1.0 35

# Window Appearance
window_padding_width 3
window_padding_height 0
background_opacity 1.0
hide_window_decorations yes
scrollback_indicator_opacity 0.0

# Cursor
cursor_trail 1
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Behavior
enable_audio_bell no
confirm_os_window_close 0
allow_remote_control yes

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

include ~/.config/kitty/dank-tabs.conf
